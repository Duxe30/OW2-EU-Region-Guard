name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OW2RG.sln

      - name: Build (Release)
        run: dotnet build OW2RG.sln -c Release --no-restore

      # Core tests are pure; Windows tests talk to the real firewall COM API read-only.
      # The opt-in live firewall test stays skipped (OW2RG_LIVE_FIREWALL_TESTS is not set).
      - name: Test
        run: dotnet test OW2RG.sln -c Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Publish self-contained x64
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: OW2-EU-Region-Guard-win-x64
          path: |
            artifacts/OW2-EU-Region-Guard-win-x64.zip
            artifacts/OW2-EU-Region-Guard-win-x64.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
